version: "3.8"

services:
  instance:
    build: .
    container_name: plone-instance
    command: ["/opt/instance/bin/instance", "fg"]
    ports:
      - "8080:8080"
    volumes:
      # Only persistent data and source code are bind-mounted.
      # eggs/parts/downloads stay inside the container to avoid
      # os.rename() ENOTEMPTY errors on bind-mounted filesystems.
      - ./data/var:/opt/instance/var
      - ./src:/opt/instance/src
      - ./buildout.cfg:/opt/instance/buildout.cfg:ro
    environment:
      LANG: "C.UTF-8"
      LC_ALL: "C.UTF-8"
      RUN_BUILDOUT: "${RUN_BUILDOUT:-0}"
      PLONE_ADMIN_PASSWORD: "admin"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

networks:
  default:
    driver: bridge
