version: "3.8"

services:
  instance:
    build: .
    container_name: plone-instance
    command: ["/opt/instance/bin/instance", "fg"]
    ports:
      - "8080:8080"
    volumes:
      - ./data/var:/opt/instance/var
      - ./data/eggs:/opt/instance/eggs
      - ./data/parts:/opt/instance/parts
      - ./data/downloads:/opt/instance/downloads
      # NOTE: venv is intentionally NOT mounted — it is baked into the image.
      - ./src:/opt/instance/src
      - ./buildout.cfg:/opt/instance/buildout.cfg:ro
    environment:
      LANG: "C.UTF-8"
      LC_ALL: "C.UTF-8"
      # Can be overridden from the host: RUN_BUILDOUT=1 docker-compose up
      RUN_BUILDOUT: "${RUN_BUILDOUT:-0}"
      PLONE_ADMIN_PASSWORD: "admin"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

networks:
  default:
    driver: bridge
