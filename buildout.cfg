[buildout]
extends = https://dist.plone.org/release/5.2.14/versions.cfg
parts = instance
allow-hosts =
    pypi.org
    files.pythonhosted.org
    dist.plone.org
develop =
    src/dezurstva.podoba
    src/dezurstva.produkti
    src/imiimenik.podoba
    src/imiimenik.produkti
    src/kiestra.podoba
    src/kiestra.produkti
    src/nadomescanja.produkti
    src/preiskave.podoba
    src/preiskave.produkti

[instance]
recipe = plone.recipe.zope2instance
user = admin:admin
eggs =
    Plone
    Products.CMFPlone
    collective.jbot
    dezurstva.podoba
    dezurstva.produkti
    imiimenik.podoba
    imiimenik.produkti
    kiestra.podoba
    kiestra.produkti
    nadomescanja.produkti
    preiskave.podoba
    preiskave.produkti
http-address = 0.0.0.0:8080
