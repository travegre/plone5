[buildout]
extends = https://dist.plone.org/release/5.2.14/versions.cfg
parts = instance 
#zeoserver client1
eggs =
   Plone
   Products.CMFPlone
   dezurstva.podoba
   dezurstva.produkti
   imiimenik.podoba
   imiimenik.produkti
   kiestra.podoba
   kiestra.produkti
   nadomescanja.produkti
   preiskave.podoba
   preiskave.produkti
allow-hosts = *
develop =
   src/*

[instance]
recipe = plone.recipe.zope2instance
user = admin:admin 
eggs = 
	Plone 
	Products.CMFPlone
	dezurstva.podoba
	dezurstva.produkti
	imiimenik.podoba
	imiimenik.produkti
	kiestra.podoba
	kiestra.produkti
	nadomescanja.produkti
	preiskave.podoba
	preiskave.produkti
http-address = 0.0.0.0:8080
